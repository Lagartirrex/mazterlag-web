<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Administración | MazterLag</title>
<link rel="icon" href="assets/img/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<main class="wrap adm">
<header class="adm-top">
<a class="brand" href="index.html"><img class="logo" src="assets/img/logo.png" alt="" width="42" height="42">Administración</a>
<button type="button" class="btn gh" id="logout" hidden>Salir</button>
</header>

<section id="login" class="adm-card">
<h1>Entrar</h1>
<p class="hint">Pegá la clave de administración (ADMIN_TOKEN). Se guarda solo mientras tengas esta pestaña abierta.</p>
<form id="login-form"><label for="tok">Clave</label><input id="tok" type="password" autocomplete="current-password" required><p class="actions"><button class="btn" type="submit">Entrar</button></p><p id="login-msg" class="warn" aria-live="polite"></p></form>
</section>

<section id="panel" hidden>
<nav class="adm-tabs" id="tabs" aria-label="Secciones">
<button type="button" data-t="guias" aria-pressed="true">Guías</button>
<button type="button" data-t="builds" aria-pressed="false">Builds</button>
<button type="button" data-t="instagram" aria-pressed="false">Instagram</button>
<button type="button" data-t="estado" aria-pressed="false">Estado</button>
</nav>
<p id="msg" class="adm-msg" aria-live="polite"></p>

<div id="t-guias"></div>
<div id="t-builds" hidden></div>
<div id="t-instagram" hidden></div>
<div id="t-estado" hidden></div>
</section>
</main>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js" defer></script>
</body>
</html>
